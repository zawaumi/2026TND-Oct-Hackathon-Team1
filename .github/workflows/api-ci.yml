name: API CI

on:
  pull_request:
    paths:
      - "apps/api/**"
      - "contracts/**"
      - ".github/workflows/api-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "contracts/**"
      - ".github/workflows/api-ci.yml"

permissions:
  contents: read

jobs:
  # Django のチェックとテスト（PostgreSQL を使う）
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      db:
        # ローカルの compose.yaml と同じ版
        image: postgres:15
        env:
          # CI のテスト専用の値。本番の認証情報とは関係ない
          POSTGRES_DB: piatomo_ci
          POSTGRES_USER: piatomo_ci
          POSTGRES_PASSWORD: piatomo_ci
        ports:
          - 5432:5432
        # DB が接続を受け付けるまで待ってから次へ進む
        options: >-
          --health-cmd "pg_isready -U piatomo_ci -d piatomo_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_DB: piatomo_ci
      POSTGRES_USER: piatomo_ci
      POSTGRES_PASSWORD: piatomo_ci
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Django check
        run: python manage.py check
      - name: Django check (production settings)
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          DJANGO_SECRET_KEY: ci-only-not-a-secret
          DJANGO_ALLOWED_HOSTS: localhost
        run: python manage.py check --deploy --fail-level ERROR
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
      - name: Test (PostgreSQL)
        run: python manage.py test --verbosity 2

  # API 契約（contracts/openapi.yaml）の構造と参照の検証
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: contracts/requirements.txt
      - name: Install
        run: python -m pip install -r contracts/requirements.txt
      - name: Validate OpenAPI
        run: openapi-spec-validator contracts/openapi.yaml

  # コンテナを作れるか（Cloud Run への配備で使う）
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build --tag piatomo-api:ci apps/api
